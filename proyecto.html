<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ermes Olea - Proyecto</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wdth,wght@75,200..900&display=swap" rel="stylesheet">

    <link rel="icon" type="image/jpg" href="logo/logo_favicon.ico">
    <link rel="stylesheet" href="css/estilo.css">
    <script defer src="js/funciones.js"></script>
    <script defer src="js/proyecto-detalle.js"></script>
</head>
<body class="body--trabajos">
    <div id="loader" class="contenedor--carga pos-centro">
        <div id="marcador--palabra" class="palabra"><img src="imagenes/global/punk_letters/cargando_01.png" alt="Cartel punk con la palabra cargando"></div>
    </div>

    <img class="minibicho" src="imagenes/global/minibichos/minibicho01.png" alt="Ilustracion de minibicho 01">
    <img class="minibicho" src="imagenes/global/minibichos/minibicho05.png" alt="Ilustracion de minibicho 05">
    <img class="minibicho" src="imagenes/global/minibichos/minibicho04.png" alt="Ilustracion de minibicho 04">

    <header>
        <nav class="menu">
            <button class="boton--abrir"><img src="imagenes/global/menu/menu_abrir.svg" alt="Icono para abrir el menu"></button>
            <button class="menu__boton--cerrar"><img src="imagenes/global/menu/menu_cerrar.svg" alt="Icono para cerrar el menu"></button>
            <ul>
                <li class="menu__logo"><a href="index.html"><img src="logo/logo.svg" alt="Logo de Ermes Olea"></a></li>
                <li class="menu__descripcion">Ermes Olea - disenadore, ilustradore y artista multidisciplinar de Madrid, Espana. <br>@2026</li>
                <li class="menu__item">
                    <a class="menu__link--archivo" href="archivo.html">
                        <img class="menu__img" src="imagenes/global/punk_letters/archivo_letras_01.svg" alt="Tipografia punk para Archivo">
                        <span>Archivo</span>
                    </a>
                </li>
                <li class="menu__item">
                    <a class="menu__link--sobremi" href="sobremi.html">
                        <img class="menu__img" src="imagenes/global/punk_letters/sobremi_letras_01.svg" alt="Tipografia punk para Sobre mi">
                        <span>Sobre&nbsp;mi</span>
                    </a>
                </li>
                <li class="menu__item">
                    <a class="menu__link--contacto" href="contacto.html">
                        <img class="menu__img" src="imagenes/global/punk_letters/contacto_letras_01.svg" alt="Tipografia punk para Contacto">
                        <span>Contacto</span>
                    </a>
                </li>
                <li class="menu__deco">
                    <img src="imagenes/global/menu/menu_estrellas.svg" alt="Ilustracion de estrellas decorativas">
                </li>
            </ul>
        </nav>
    </header>

    <div class="trabajos">
        <div class="trabajos__imagenes" data-project-gallery></div>

        <div class="trabajos__explicacion">
            <a href="archivo.html" class="trabajos__explicacion-volver">
                <img class="trabajos__explicacion-volver flecha" src="imagenes/archivo/ar_flecha.svg" alt="Flecha para volver a archivo"> VOLVER A ARCHIVO
            </a>
            <img data-project-logo src="" alt="Logo del proyecto" class="trabajos__marco trabajos__marco--logo">
            <div class="trabajos__explicacion__contenido">
                <span class="trabajos__explicacion__categoria" data-project-category>EDITORIAL//</span>
                <h2 class="trabajos__explicacion__titulo" data-project-title>Proyecto</h2>
                <p class="trabajos__explicacion__texto" data-project-text></p>

                <div class="trabajos__explicacion__ficha" data-project-ficha></div>
                <div data-project-cta></div>
            </div>
        </div>
    </div>
</body>
</html>
